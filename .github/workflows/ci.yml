name: Verify application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: harbor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harbor -d harbor_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://harbor:ci-only-disposable@localhost:5432/harbor_test
      REDIS_URL: redis://localhost:6379/9
      TEST_DATABASE_URL: postgresql://harbor:ci-only-disposable@localhost:5432/harbor_test
      TEST_REDIS_URL: redis://localhost:6379/9
      APP_ORIGIN: https://chat.6hx9.com
      COOKIE_SECURE: 'true'
      UPLOAD_DIR: /tmp/harbor-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run i18n:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser viewport and real message acceptance
        run: npm run test:browser:ci
        env:
          # Keep real browser registrations separate from API tests' IP quotas.
          # Both use the normal limiter, in disposable Redis service databases.
          REDIS_URL: redis://localhost:6379/10
      - name: Harbor login and registration acceptance
        run: npm run test:browser:ci
        env:
          REDIS_URL: redis://localhost:6379/11
          BROWSER_TEST_SCRIPT: scripts/test-auth-harbor.mjs
      - name: Community and private ticket acceptance
        run: npm run test:browser:ci
        env:
          REDIS_URL: redis://localhost:6379/12
          BROWSER_TEST_SCRIPT: scripts/test-community-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-viewport-regressions
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: ignore
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml build
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml up -d --wait --wait-timeout 180
        env:
          APP_ORIGIN: https://chat.6hx9.com
      - run: |
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/ > /dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml exec -T nginx nginx -t
      - run: node scripts/smoke.mjs
        env:
          SMOKE_ORIGIN: https://chat.6hx9.com
      - run: ./scripts/verify-backup-ci.sh
      - if: failure()
        run: |
          if [ -f .env.example ]; then docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml logs --no-color --tail=100; fi
      - if: always()
        run: |
          if [ -f .env.example ]; then docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.caddy.yml down; fi
